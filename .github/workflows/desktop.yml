# File: Build and use the actual parser-free Foundry GUI; no release or binary artifact uploads.
name: Desktop application validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    name: Real PDF authoring application / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Select the patched native Python runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: { python-version: "3.14.10", check-latest: true }
      - name: Select the exact editor major toolchain
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: "24", package-manager-cache: false }
      - name: Install exact source and packaging locks
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock -r requirements-package.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - run: npm --prefix web ci --ignore-scripts
      - run: npm --prefix web run build
      - name: Install the exact locked browser
        timeout-minutes: 5
        run: npm --prefix web exec -- playwright install chromium
      - name: Prove actual browser host requirements
        timeout-minutes: 2
        run: npm --prefix web run check:browser-host
      - name: Build, safely extract and use the actual application
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            command -v xvfb-run
            xvfb-run -a python -m tools.package_app --output-root .runtime/native-ci
          else
            python -m tools.package_app --output-root .runtime/native-ci
          fi
