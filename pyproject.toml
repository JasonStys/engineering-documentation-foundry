[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "engineering-documentation-foundry"
version = "0.1.0"
description = "Deterministic technical-document migration with provenance and quality gates."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jason Stys" }]
keywords = ["documentation", "pdf", "provenance", "accessibility", "migration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "Jinja2>=3.1.6,<4",
  "pydantic>=2.11,<3",
  "PyMuPDF>=1.26,<2",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "hypothesis>=6.138,<7",
  "mypy>=1.17,<3",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "reportlab>=4.4,<5",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
docfoundry = "docfoundry.cli:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/docfoundry"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
markers = [
  "performance: deterministic performance-bound checks",
]

[tool.coverage.run]
branch = true
source = ["docfoundry"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
packages = ["docfoundry"]
